[project]
name = "recall-api"
version = "0.1.0"
description = ""
authors = [
    {name = "JoaoLucasmcS",email = "joaolucasmcs04@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,< 4.0"
dependencies = [
    "fastapi[standard] (>=0.141.1,<0.142.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.16.1,<0.17.0)",
    "typos (>=1.48.0,<2.0.0)",
    "taskipy (>=1.14.1,<2.0.0)"
]

[tool.taskipy.tasks]
run = "fastapi dev recall_api/app.py"
pre_test = "task lint"
test = "pytest -s -x --cov=recall_api -vv"
post_test = "coverage html"
lint = "ruff check . && ruff check . --diff"
format = "ruff check . --fix && ruff format ."

[tool.ruff]
line-length = 79
extend-exclude = ["migrations"]
preview = true
lint.select = ["I", "F", "E", "W", "PL", "PT"]

[tool.pytest.ini_options]
pythonpath = ['.']
addopts  = ['-p', 'no:warnings', '--cov=recall_api', '--cov-context=test']